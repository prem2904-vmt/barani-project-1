name: tests

# The full test suites, on the dev PC's test runner (labels pf-tests). Called by release-dev (gated: skipped
# when the PC is off) and release-stage / release-prod (mandatory: no release unless these pass).
on:
  workflow_call:
    inputs:
      ref: { type: string, required: true, description: Build number or full commit SHA }
  workflow_dispatch:
    inputs:
      ref: { description: Build number or full commit SHA (empty = latest main), required: false, default: '' }

jobs:
  run:
    name: tests
    runs-on: [self-hosted, pf-tests]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check out the build being released
        env:
          REF: ${{ inputs.ref }}
        run: |
          # only a build number (….-<sha>) or a hex commit reaches git
          if [ -z "$REF" ]; then sha=$(git rev-parse origin/main)
          elif [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then sha="$REF"
          elif [[ "$REF" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+-([0-9a-f]{7,40})$ ]]; then sha=$(git rev-parse --verify "${BASH_REMATCH[1]}^{commit}")
          else echo "::error::not a build number or commit: $REF"; exit 1; fi
          git checkout -q --detach "$sha"
          echo "Testing **$(git log --oneline -1)**" >> "$GITHUB_STEP_SUMMARY"
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Unit tests (all)
        env:
          NODE_OPTIONS: --localstorage-file=${{ runner.temp }}/ls.json
        run: npx nx test lms --skip-nx-cache
      - name: Build
        run: npx nx build lms --configuration=development --skip-nx-cache
      # Every screens spec on every form factor: phone, tablet (portrait + landscape), desktop browser, desktop app
      # (Electron preload stubbed in-page). Screenshots land in SHOTS_DIR/<project>/.
      - name: Screen tests (Playwright, API mocked, every form factor)
        env:
          PW_WORKERS: '6'
        run: |
          CH=$(ls -d ~/.cache/ms-playwright/chromium-*/chrome-linux*/chrome | sort -V | tail -1)
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1])')
          node apps/lms-e2e/serve-spa.mjs dist/apps/lms/browser "$PORT" > "$RUNNER_TEMP/spa.log" 2>&1 & SPA=$!
          trap 'kill $SPA' EXIT; sleep 2
          BASE_URL="http://127.0.0.1:$PORT" PW_CHROME_PATH="$CH" SHOTS_DIR="$RUNNER_TEMP/shots" \
            ./node_modules/.bin/playwright test --config=apps/lms-e2e/playwright.screens.config.ts --reporter=line
      # The same screens on Safari (iPhone / iPad / Mac WebKit), Firefox, Google Chrome and Microsoft Edge. The PC's
      # Ubuntu can't run Playwright's WebKit/Edge natively, so they run in the official Playwright image
      # (tools/e2e-browsers.Dockerfile, built once on the runner and cached).
      - name: Screen tests on Safari, Firefox, Chrome and Edge (Playwright image)
        env:
          PW_WORKERS: '6'
        run: |
          PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1])')
          node apps/lms-e2e/serve-spa.mjs dist/apps/lms/browser "$PORT" > "$RUNNER_TEMP/spa-browsers.log" 2>&1 & SPA=$!
          trap 'kill $SPA' EXIT; sleep 2
          BASE_URL="http://127.0.0.1:$PORT" SHOTS_DIR=/work/test-results/shots-browsers tools/e2e-browsers.sh --reporter=line
      - name: Keep the failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: test-results, retention-days: 7, if-no-files-found: ignore }
