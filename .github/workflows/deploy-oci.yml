name: deploy-oci

# Builds this site on the Oracle ARM server (self-hosted runner, label "oci") with
# the same "npm run build" DigitalOcean runs, then swaps it into /opt/pf/www.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: oci-${{ github.ref_name }}
  cancel-in-progress: true

env:
  SITE: /opt/pf/www/med-dev

jobs:
  deploy:
    runs-on: [self-hosted, oci]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build (npm run build, Node 22)
        run: |
          flock /tmp/pf-build.lock docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -e ELECTRON_SKIP_BINARY_DOWNLOAD=1 -e NODE_OPTIONS=--max-old-space-size=4096 \
            -v "$PWD":/w -w /w node:22 sh -c "npm ci --no-audit --no-fund && npm run build"
          test -f public/index.html
      - name: Publish
        run: |
          rsync -a --delete public/ "$SITE.next/"
          rm -rf "$SITE.old"; [ -d "$SITE" ] && mv "$SITE" "$SITE.old"; mv "$SITE.next" "$SITE"; rm -rf "$SITE.old"
          echo "published $(find "$SITE" -type f | wc -l) files"
