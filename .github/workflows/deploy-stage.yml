name: deploy-stage

# Promotes a build to STAGE on the Oracle stage server (runner label "oci-stage").
# Manual only: Actions -> deploy-stage -> Run workflow -> pick the commit/branch/tag.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to deploy to stage
        required: true
        default: stage

concurrency:
  group: stage-deploy
  cancel-in-progress: false

env:
  SITE: /opt/pf/www/med-stg

jobs:
  deploy:
    runs-on: [self-hosted, oci-stage]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Build (npm run build:stage, Node 22)
        run: |
          flock /tmp/pf-build.lock docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e CI=true \
            -e ELECTRON_SKIP_BINARY_DOWNLOAD=1 -e NODE_OPTIONS=--max-old-space-size=4096 \
            -v "$PWD":/w -w /w node:22 sh -c "npm ci --no-audit --no-fund && npm run build:stage"
          test -f public/index.html
      - name: Publish
        run: |
          rsync -a --delete public/ "$SITE.next/"
          rm -rf "$SITE.old"; [ -d "$SITE" ] && mv "$SITE" "$SITE.old"; mv "$SITE.next" "$SITE"; rm -rf "$SITE.old"
          echo "published $(find "$SITE" -type f | wc -l) files from $(git rev-parse --short HEAD)"
