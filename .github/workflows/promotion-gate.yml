name: promotion-gate

# Enforces the linear environment-promotion policy (see BRANCHING.md):
#   dev → stage → main   (adjacent-only, no skipping, no cross-merges)
# Runs on every PR that targets `stage` or `main` and fails the check unless
# the PR's source branch is the correct adjacent environment. Make this a
# REQUIRED status check on `stage` and `main` so a violating PR cannot merge.
on:
  pull_request:
    branches: [stage, main]

jobs:
  promotion-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev → stage → main promotion path
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "Promotion PR: '$HEAD' → '$BASE'"
          if [ "$BASE" = "stage" ] && [ "$HEAD" != "dev" ]; then
            echo "::error::'stage' only accepts promotions from 'dev' (got '$HEAD'). See BRANCHING.md."
            exit 1
          fi
          if [ "$BASE" = "main" ] && [ "$HEAD" != "stage" ]; then
            echo "::error::'main' only accepts promotions from 'stage' (got '$HEAD'). dev→main is prohibited. See BRANCHING.md."
            exit 1
          fi
          echo "Promotion path OK — '$HEAD' → '$BASE' is allowed."
