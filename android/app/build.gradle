apply plugin: 'com.android.application'
// Kotlin: the PfBridgeLocal plugin (health.prefrontal.lab.bridge) is Kotlin;
// the rest of the app stays Java.
apply plugin: 'kotlin-android'

// Play upload signing — android/key.properties + android/keystore/ are
// gitignored; keep the keystore backed up. Play App Signing holds the real
// distribution key, so a lost upload key is recoverable via the console.
def keyProps = new Properties()
def keyPropsFile = rootProject.file('key.properties')
if (keyPropsFile.exists()) keyProps.load(new FileInputStream(keyPropsFile))

android {
    namespace "health.prefrontal.lab"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "health.prefrontal.lab"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.0.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // The trailing '!* N.*' entries drop iCloud conflict copies
            // ("chunk-X 2.js") that iCloud Drive keeps re-materialising into
            // assets/public — without them a copy can break the build (res)
            // or double the shipped bundle (assets).
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!* 2.*:!* 3.*:!* 4.*:!* 5.*:!* 6.*:!* 7.*:!* 8.*:!* 9.*'
        }
    }
    signingConfigs {
        release {
            if (keyPropsFile.exists()) {
                storeFile rootProject.file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (keyPropsFile.exists()) signingConfig signingConfigs.release
        }
    }
}

// iCloud Drive keeps re-materialising "name 2.ext" conflict copies into the
// source tree faster than they can be hand-deleted; they broke a release
// build once (res/) and shipped 170 junk files into an AAB (assets/). Scrub
// them at the very start of every build so neither can happen again. The
// ignoreAssetsPattern above is the second line of defence for any that
// reappear between this task and asset merging.
tasks.register('scrubICloudConflictCopies', Delete) {
    delete fileTree(dir: 'src/main', includes: [
        '**/* 2.*', '**/* 3.*', '**/* 4.*', '**/* 5.*',
        '**/* 6.*', '**/* 7.*', '**/* 8.*', '**/* 9.*',
    ])
}
preBuild.dependsOn 'scrubICloudConflictCopies'

// A transitive dep pins relinker 1.3.1, which only ever lived on the (now
// dead) jcenter — mavenCentral has 1.4.x. Force an available, API-compatible
// version so the release build can resolve.
configurations.all {
    resolutionStrategy {
        force 'com.getkeepsafe.relinker:relinker:1.4.5'
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // PrefrontalMessagingService subclasses the push plugin's
    // FirebaseMessagingService; the plugin keeps firebase-messaging as an
    // `implementation` dep, so it isn't on our compile classpath. Keep the
    // version in step with node_modules/@capacitor/push-notifications/android/build.gradle.
    implementation "com.google.firebase:firebase-messaging:${project.hasProperty('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'}"
    // Reply-from-notification credentials (ChatReplyStore): AES-256 with a
    // Keystore master key.
    implementation "androidx.security:security-crypto:1.1.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
