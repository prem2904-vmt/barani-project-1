<section class="pf-auth">
  <div class="pf-auth__mesh" aria-hidden="true">
    <span class="pf-auth__blob pf-auth__blob--1"></span>
    <span class="pf-auth__blob pf-auth__blob--2"></span>
    <span class="pf-auth__blob pf-auth__blob--3"></span>
  </div>

  <main class="pf-auth__stack">
    <header class="pf-auth__brand">
      <pf-logo-mark size="lg" variant="glyph" [pulse]="true" ariaLabel="Prefrontal"></pf-logo-mark>
      <div class="pf-auth__brand-text">
        <p class="pf-auth__wordmark">Prefrontal</p>
        <p class="pf-auth__tagline">Set a new password to continue.</p>
      </div>
    </header>

    <form class="pf-auth__form" (ngSubmit)="submit()" novalidate
          [class.pf-auth__form--busy]="busy()">
      <h1 class="pf-auth__title">Choose a new password</h1>
      <p class="pf-auth__hint" style="margin: -4px 0 4px;">
        Your temporary password must be replaced before you can continue.
        Use 8–64 characters — longer is stronger.
      </p>

      <label class="pf-auth__field">
        <span class="pf-auth__field-label">New password</span>
        <span class="pf-auth__field-row">
          <input class="pf-auth__field-input"
                 [type]="showPassword() ? 'text' : 'password'"
                 autocomplete="new-password"
                 autocapitalize="off"
                 autocorrect="off"
                 spellcheck="false"
                 enterkeyhint="next"
                 required
                 [ngModel]="pw()"
                 (ngModelChange)="pw.set($event); error.set(null)"
                 name="newPassword"
                 placeholder="••••••••" />
          <button type="button" class="pf-auth__eye"
                  (click)="showPassword.set(!showPassword())"
                  [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            @if (showPassword()) {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3l18 18M10.6 10.6A2 2 0 0 0 12 14a2 2 0 0 0 1.4-.6"/>
                <path d="M9.9 5.1A11 11 0 0 1 12 5c5 0 9 4 10 7a13 13 0 0 1-2.4 3.4M6.4 6.4A13 13 0 0 0 2 12c1 3 5 7 10 7a11 11 0 0 0 4-.7"/>
              </svg>
            } @else {
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </span>
        @if (tooShort()) {
          <span class="pf-auth__field-label" style="color: var(--pf-warn, #b45309);">At least 8 characters.</span>
        }
      </label>

      <label class="pf-auth__field">
        <span class="pf-auth__field-label">Confirm password</span>
        <span class="pf-auth__field-row">
          <input class="pf-auth__field-input"
                 [type]="showPassword() ? 'text' : 'password'"
                 autocomplete="new-password"
                 autocapitalize="off"
                 autocorrect="off"
                 spellcheck="false"
                 enterkeyhint="go"
                 required
                 [ngModel]="confirm()"
                 (ngModelChange)="confirm.set($event); error.set(null)"
                 name="confirmPassword"
                 placeholder="••••••••" />
        </span>
        @if (mismatch()) {
          <span class="pf-auth__field-label" style="color: var(--pf-warn, #b45309);">Passwords don’t match.</span>
        }
      </label>

      @if (error()) {
        <p class="pf-auth__error" role="alert">
          <span class="pf-auth__error-icon" aria-hidden="true">!</span>
          <span class="pf-auth__error-msg">{{ error() }}</span>
        </p>
      }

      <button type="submit"
              class="pf-auth__submit"
              (click)="submit($event)"
              [disabled]="busy() || !canSubmit()">
        @if (busy()) {
          <pf-loading-logo size="xs" color="white" [inline]="true"></pf-loading-logo>
          <span>Saving…</span>
        } @else {
          <span>Set password &amp; continue</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6"/>
          </svg>
        }
      </button>

      <button type="button" class="pf-auth__hint"
              style="background: none; border: 0; cursor: pointer; text-align: center;"
              (click)="signOut()">
        Sign in as a different user
      </button>
    </form>

    <footer class="pf-auth__foot">
      <span>Prefrontal LMS · v0.1.0</span>
    </footer>
  </main>
</section>
