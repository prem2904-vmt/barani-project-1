<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prefrontal</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a15" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ede8f6" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- 'black-translucent' draws under the iOS status bar so the violet
         theme bleeds to the very top of the notch — pair with safe-area-
         inset-top on fixed headers so content sits below the clock. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Prefrontal" />
    <!-- Disable iOS automatic phone-number detection — false positives on
         MRN strings (DEL-2605-…) wreck the layout. -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Vector PF mark as the favicon. /favicon.svg is a dedicated square
         badge variant tuned for small sizes; /logo.svg (vertical glyph) is
         kept around for other parts of the app. The pre-generated PNG /
         ICO set in /favicon_io is from an old pass (a house glyph) and is
         deliberately not referenced — the SVG-only setup keeps the right
         icon everywhere modern browsers render. ?v=2 busts cached copies
         of the wrong icon on existing sessions. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="favicon.svg?v=3" />
    <link rel="mask-icon" href="favicon.svg?v=3" color="#a855f7" />
    <link rel="manifest" href="favicon_io/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Load the web fonts WITHOUT blocking render. On a cold/throttled launch
      inside WKWebView (esp. when relaunched by a push) the network process can
      take several seconds to come up; a render-blocking remote stylesheet
      starves the local chunk requests and contributes to a blank-screen boot.
      The media="print"→onload swap fetches the CSS asynchronously; native body
      text falls back to the system stack until it arrives.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      />
    </noscript>
    <!--
      Apply theme BEFORE Angular boots to prevent flash of wrong theme.
      Priority: localStorage override > prefers-color-scheme > dark.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pf-theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var resolved =
            mode === 'system'
              ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
              : mode;
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-mode', mode);
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-theme-mode', 'system');
        }
      })();
    </script>
    <!--
      Cold-launch chunk self-heal. Inside WKWebView a cold/background relaunch
      (e.g. when iOS wakes the app for a VoIP/push) can ABORT a dynamic module
      (chunk-XXXX.js) request while the WebContent process is still spinning up,
      leaving a permanent blank screen — exactly the "closed app → nothing
      works" symptom. We register these listeners BEFORE the module scripts run,
      so a failed chunk load triggers a single self-healing reload (the asset is
      present in the bundle; the request just lost a startup race). A
      sessionStorage counter caps retries so a genuinely-missing asset can't
      loop. The counter is cleared once <app-root> actually renders.
    -->
    <script>
      (function () {
        function isChunkError(s) {
          return /chunk-[A-Z0-9]+\.js|dynamically imported module|Importing a module script failed|module script failed|Request failed/i.test(
            String(s || '')
          );
        }
        var MAX = 2;
        function recover() {
          try {
            var n = parseInt(sessionStorage.getItem('pf-chunk-reloads') || '0', 10);
            if (n >= MAX) return;
            sessionStorage.setItem('pf-chunk-reloads', String(n + 1));
          } catch (e) {}
          // Let the WebView settle a beat before re-requesting.
          setTimeout(function () { try { location.reload(); } catch (e) {} }, 500);
        }
        // Resource (script/link) load failures don't bubble — listen in capture.
        window.addEventListener(
          'error',
          function (e) {
            var t = e && e.target;
            var url = t && (t.src || t.href);
            if (url && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
              if (isChunkError(url)) recover();
            } else if (e && isChunkError(e.message)) {
              recover();
            }
          },
          true
        );
        window.addEventListener('unhandledrejection', function (e) {
          var r = e && e.reason;
          if (isChunkError(r && (r.message || r))) recover();
        });
        // Once the app has actually mounted, clear the counter so a future
        // transient failure can recover again.
        var poll = setInterval(function () {
          var root = document.querySelector('app-root');
          if (root && root.children.length > 0) {
            try { sessionStorage.removeItem('pf-chunk-reloads'); } catch (e) {}
            clearInterval(poll);
          }
        }, 1000);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
