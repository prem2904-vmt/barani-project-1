<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prefrontal · LMS</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a15" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ede8f6" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Match resident-fe: vector PF mark as the primary favicon so the tab
         icon stays crisp at any DPR. Keep the PNG set as fallbacks for
         platforms without SVG favicon support. -->
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon_io/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon_io/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="logo.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon_io/apple-touch-icon.png" />
    <link rel="manifest" href="favicon_io/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Apply theme BEFORE Angular boots to prevent flash of wrong theme.
      Priority: localStorage override > prefers-color-scheme > dark.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('pf-theme');
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var resolved =
            mode === 'system'
              ? (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
              : mode;
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-mode', mode);
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.setAttribute('data-theme-mode', 'system');
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
