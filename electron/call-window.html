<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>Incoming call</title>
  <style>
    :root { color-scheme: dark light; --bg: #0b1020; --card: #121a33; --text: #eef2ff; --muted: #9aa4c7;
            --answer: #16a34a; --answer-h: #15803d; --decline: #dc2626; --decline-h: #b91c1c; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #ffffff; --card: #f5f7fb; --text: #0f172a; --muted: #475569; }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
                 font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                 -webkit-user-select: none; user-select: none; overflow: hidden; }
    .card { height: 100%; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto;
            gap: 10px 12px; padding: 16px; -webkit-app-region: drag; border: 1px solid rgba(127,127,127,.25); border-radius: 12px; }
    .avatar { grid-row: 1; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
              background: #2e86ab; color: #fff; font-weight: 600; font-size: 16px; }
    .who { min-width: 0; align-self: center; }
    .eyebrow { margin: 0; color: var(--muted); font-size: 12px; letter-spacing: .02em; }
    .name { margin: 2px 0 0; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .actions { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; -webkit-app-region: no-drag; }
    button { height: 36px; border: 0; border-radius: 8px; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
             display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    button:focus-visible { outline: 2px solid #93c5fd; outline-offset: 2px; }
    .decline { background: var(--decline); } .decline:hover { background: var(--decline-h); }
    .answer { background: var(--answer); } .answer:hover { background: var(--answer-h); }
    svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    @media (prefers-reduced-motion: no-preference) {
      .avatar { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(46,134,171,.55); } 50% { box-shadow: 0 0 0 8px rgba(46,134,171,0); } }
    }
  </style>
</head>
<body>
  <div class="card" role="alertdialog" aria-labelledby="name" aria-describedby="eyebrow">
    <div class="avatar" id="initials" aria-hidden="true"></div>
    <div class="who">
      <p class="eyebrow" id="eyebrow">Incoming audio call</p>
      <p class="name" id="name">A colleague</p>
    </div>
    <div class="actions">
      <button class="decline" id="decline" type="button" aria-label="Decline call">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>Decline
      </button>
      <button class="answer" id="answer" type="button" aria-label="Answer call">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.59 2.81.72A2 2 0 0 1 22 16.92z"/></svg>Answer
      </button>
    </div>
  </div>
  <script>
    (function () {
      var api = window.pfCallWindow;
      function initials(n) {
        var parts = String(n || '').trim().split(/\s+/).filter(Boolean);
        return ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
      }
      api.onInfo(function (info) {
        if (!info) return;
        document.getElementById('name').textContent = info.isGroup && info.groupName
          ? info.callerName + ' · ' + info.groupName : info.callerName;
        document.getElementById('eyebrow').textContent = info.isGroup ? 'Incoming group call' : 'Incoming audio call';
        document.getElementById('initials').textContent = initials(info.callerName);
      });
      document.getElementById('answer').addEventListener('click', function () { api.act('answer'); });
      document.getElementById('decline').addEventListener('click', function () { api.act('decline'); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') api.act('decline');
      });
    })();
  </script>
</body>
</html>
