server {
    listen 80;
    listen 3000;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
