server {
    listen 80;
    listen 3000;
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Handle React Router SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api calls to backend service on Railway
    location /api/ {
        proxy_pass https://barani-project-1-production.up.railway.app/api/;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host barani-project-1-production.up.railway.app;
        proxy_cache_bypass $http_upgrade;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
